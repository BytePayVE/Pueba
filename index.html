<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTEPAY VE - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-brand">
            <div class="header-logo">BP</div>
            <span style="font-weight: 900; font-size: 16px;">BYTEPAY VE</span>
        </div>
    </header>

    <main>
        <div class="app-container">
            <div id="view-home" class="view active">
                <h1>Iniciar sesión</h1>
                <p class="subtitle">Ingrese su número de contrato o credenciales de acceso</p>

                <div class="form-group">
                    <label>Número de Contrato (Cliente)</label>
                    <input type="text" id="inputContrato" placeholder="Ej. N33">
                </div>
                <button class="btn btn-primary" onclick="iniciarSesion('cliente')">Entrar como Cliente</button>
                
                <div style="width:100%; height:1px; background:var(--border); margin:20px 0;"></div>
                
                <div class="form-group">
                    <label>Tipo de Panel Administrativo</label>
                    <select id="selectTipoAdmin" onchange="cambiarModoLogin()">
                        <option value="maestro">Enterprise Maestro</option>
                        <option value="alianza">Tienda Aliada</option>
                    </select>
                </div>

                <div id="divLoginMaestro" class="form-group">
                    <label>Contraseña Maestro</label>
                    <input type="password" id="inputAdminPass" placeholder="******">
                </div>

                <div id="divLoginAlianza" class="form-group" style="display: none;">
                    <label>RIF Tienda Aliada</label>
                    <input type="text" id="inputAlianzaRifUser" style="margin-bottom: 10px;">
                    <label>Contraseña Tienda</label>
                    <input type="password" id="inputAlianzaPass">
                </div>

                <button class="btn btn-secondary" onclick="iniciarSesion('admin')">Ingresar al Panel</button>
            </div>

            <div id="view-loader" class="view" style="align-items:center; display:none; padding: 50px 0;">
                <h2 style="font-size: 16px; font-weight: 700;">Conectando a la Base de Datos...</h2>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBboWF2cTQdWgjaSxqQb3BMPJCKFs0ftEM",
            authDomain: "jotech-contratos.firebaseapp.com",
            projectId: "jotech-contratos",
            storageBucket: "jotech-contratos.firebasestorage.app",
            messagingSenderId: "109219790720",
            appId: "1:109219790720:web:b9d410cc0725e3eebf0b65"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.cambiarModoLogin = function() {
            const modo = document.getElementById('selectTipoAdmin').value;
            document.getElementById('divLoginMaestro').style.display = modo === 'maestro' ? 'block' : 'none';
            document.getElementById('divLoginAlianza').style.display = modo === 'alianza' ? 'block' : 'none';
        }

        window.iniciarSesion = async function(tipo) {
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-loader').style.display = 'flex';

            try {
                if (tipo === 'cliente') {
                    const contratoId = document.getElementById('inputContrato').value.trim();
                    if (!contratoId) throw new Error("Ingrese un contrato.");
                    
                    const clienteDoc = await getDoc(doc(db, "clientes", contratoId));
                    if (!clienteDoc.exists()) throw new Error("Contrato no existe.");
                    
                    window.location.href = `contrato.html?id=${contratoId}`;
                } else {
                    const modo = document.getElementById('selectTipoAdmin').value;
                    if (modo === 'maestro') {
                        if (document.getElementById('inputAdminPass').value === "teo1212") {
                            window.location.href = "admin.html";
                        } else throw new Error("Clave maestra incorrecta.");
                    } else {
                        const rif = document.getElementById('inputAlianzaRifUser').value.trim();
                        const pass = document.getElementById('inputAlianzaPass').value.trim();
                        if (!rif || !pass) throw new Error("Faltan credenciales.");

                        const alianzaDoc = await getDoc(doc(db, "alianzas", rif));
                        if (!alianzaDoc.exists() || alianzaDoc.data().password !== pass) {
                            throw new Error("Credenciales de alianza incorrectas.");
                        }
                        window.location.href = `comercio.html?rif=${rif}`;
                    }
                }
            } catch (error) {
                document.getElementById('view-loader').style.display = 'none';
                document.getElementById('view-home').style.display = 'flex';
                alert(error.message);
            }
        };
    </script>
</body>
</html>
