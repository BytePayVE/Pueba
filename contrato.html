<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTEPAY VE - Aliado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header><div class="header-brand"><div class="header-logo">BP</div><span style="font-weight: 900;">ALIANZA</span></div></header>
    <main>
        <div class="app-container">
            <div class="view active">
                <h1 id="lblAliNombre">Tienda Aliada</h1>
                <div class="admin-tabs">
                    <button class="tab-btn active" onclick="tab('tab-vender', this)">Vender Producto</button>
                    <button class="tab-btn" onclick="tab('tab-ventas', this)">Mis Ventas</button>
                </div>

                <div id="tab-vender" class="admin-section active">
                    <div class="form-group"><label>Nro. Contrato Cliente</label><input type="text" id="vContrato"></div>
                    <div class="form-group"><label>Artículo</label><input type="text" id="vArt"></div>
                    <div class="form-group"><label>Costo ($)</label><input type="number" id="vCosto"></div>
                    <button class="btn btn-primary" onclick="vender()">Asignar Venta</button>
                </div>

                <div id="tab-ventas" class="admin-section"><div id="listaVentas" style="max-height:300px; overflow-y:auto;"></div></div>
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">Cerrar Sesión</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyBboWF2cTQdWgjaSxqQb3BMPJCKFs0ftEM", authDomain: "jotech-contratos.firebaseapp.com",
            projectId: "jotech-contratos", storageBucket: "jotech-contratos.firebasestorage.app",
            messagingSenderId: "109219790720", appId: "1:109219790720:web:b9d410cc0725e3eebf0b65"
        }));

        const rif = new URLSearchParams(window.location.search).get('rif');
        let nombreAliado = "";

        async function init() {
            if(!rif) window.location.href = 'index.html';
            const docAli = await getDoc(doc(db, "alianzas", rif));
            if(!docAli.exists()) window.location.href = 'index.html';
            nombreAliado = docAli.data().nombre;
            document.getElementById('lblAliNombre').innerText = nombreAliado;

            const q = query(collection(db, "articulos"));
            const arts = await getDocs(q);
            let h = '';
            arts.forEach(a => { if(a.data().alianzaAsociada && a.data().alianzaAsociada.includes(nombreAliado)) h += `<div class="admin-list-item">Contrato #${a.data().contratoId} - ${a.data().nombreArticulo} ($${a.data().costoTotal})</div>`; });
            document.getElementById('listaVentas').innerHTML = h || 'Sin ventas.';
        }
        init();

        window.vender = async function() {
            const idC = document.getElementById('vContrato').value;
            const cb = parseFloat(document.getElementById('vCosto').value);
            if(!idC || !cb) { alert("Faltan datos"); return; }
            
            const docC = await getDoc(doc(db, "clientes", idC));
            if(!docC.exists()) { alert("Contrato no existe en BD"); return; }

            await setDoc(doc(collection(db, "articulos")), { contratoId: idC, nombreArticulo: document.getElementById('vArt').value, costoTotal: cb, valorInicial: (cb*0.4), totalCuotas: 4, cuotaValor: ((cb-(cb*0.4))/4), alianzaAsociada: nombreAliado, cuotasPagadas: ["inicial"] });
            alert("Venta registrada!"); init();
        };
    </script>
    <script>
        function tab(id, btn) { document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); btn.classList.add('active'); }
    </script>
</body>
</html>
