<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTEPAY VE - Panel Maestro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-brand"><div class="header-logo">BP</div><span style="font-weight: 900;">MAESTRO</span></div>
    </header>
    <main>
        <div class="app-container">
            <div class="view active">
                <div class="admin-tabs">
                    <button class="tab-btn active" onclick="tab('tab-contratos', this)">Nuevo Contrato</button>
                    <button class="tab-btn" onclick="tab('tab-alianzas', this)">Aliados</button>
                    <button class="tab-btn" onclick="tab('tab-lista', this)">Listado BD</button>
                </div>

                <div id="tab-contratos" class="admin-section active">
                    <div class="form-group"><label>Nro. Contrato</label><input type="text" id="admContrato"></div>
                    <div class="form-group"><label>Cédula</label><input type="text" id="admCedula"></div>
                    <div class="form-group"><label>Nombre</label><input type="text" id="admTitular"></div>
                    <div class="form-group"><label>Tienda Aliada</label><select id="admAliado"></select></div>
                    <div style="border: 1px solid var(--border); padding: 14px; border-radius: 12px; margin-bottom: 14px;">
                        <div class="form-group"><label>Artículo</label><input type="text" id="admArticulo"></div>
                        <div style="display:flex; gap:10px;">
                            <div class="form-group" style="flex:1;"><label>Costo Base ($)</label><input type="number" id="admCosto" oninput="calcAdmin()"></div>
                            <div class="form-group" style="flex:1;"><label>% Inicial</label><select id="admPorc" onchange="calcAdmin()"><option value="30">30%</option><option value="40" selected>40%</option></select></div>
                        </div>
                        <div class="form-group"><label>Cuotas Mensuales</label><input type="number" id="admCuotas" value="4" oninput="calcAdmin()"></div>
                        <p style="font-size:12px; color:var(--text-muted);">Total: <b id="rTot" style="color:#fff;">$0</b> | Inicial: <b id="rIni" style="color:#fff;">$0</b> | Cuota: <b id="rCuo" style="color:#fff;">$0</b></p>
                    </div>
                    <button class="btn btn-primary" onclick="crearContrato()">Crear Contrato en BD</button>
                </div>

                <div id="tab-alianzas" class="admin-section">
                    <div class="form-group"><label>Nombre Aliado</label><input type="text" id="aliNombre"></div>
                    <div class="form-group"><label>RIF</label><input type="text" id="aliRif"></div>
                    <div class="form-group"><label>Clave</label><input type="password" id="aliPass"></div>
                    <button class="btn btn-primary" onclick="crearAliado()">Guardar Aliado</button>
                </div>

                <div id="tab-lista" class="admin-section">
                    <div id="listaAdminGlobal" style="max-height:300px; overflow-y:auto;"></div>
                </div>

                <button class="btn btn-secondary" onclick="window.location.href='index.html'">Cerrar Sesión</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyBboWF2cTQdWgjaSxqQb3BMPJCKFs0ftEM", authDomain: "jotech-contratos.firebaseapp.com",
            projectId: "jotech-contratos", storageBucket: "jotech-contratos.firebasestorage.app",
            messagingSenderId: "109219790720", appId: "1:109219790720:web:b9d410cc0725e3eebf0b65"
        }));

        async function initMaestro() {
            const snapA = await getDocs(collection(db, "alianzas"));
            let opts = '<option value="Directo">Directo BytePay</option>';
            snapA.forEach(d => opts += `<option value="${d.data().nombre}">${d.data().nombre} (${d.data().rif})</option>`);
            document.getElementById('admAliado').innerHTML = opts;

            const snapC = await getDocs(collection(db, "clientes"));
            let list = '';
            snapC.forEach(d => list += `<div class="admin-list-item"><b>#${d.id}</b> - ${d.data().nombreTitular} <button class="btn" style="width:auto; padding:4px 8px; font-size:10px; background:red; color:#fff;" onclick="delC('${d.id}')">X</button></div>`);
            document.getElementById('listaAdminGlobal').innerHTML = list || 'Sin contratos.';
        }
        initMaestro();

        window.crearContrato = async function() {
            const id = document.getElementById('admContrato').value;
            const cb = parseFloat(document.getElementById('admCosto').value) || 0;
            const porc = parseInt(document.getElementById('admPorc').value);
            const cuotas = parseInt(document.getElementById('admCuotas').value);
            const valIni = (cb * porc) / 100;
            const cuotaVal = (cb - valIni) / cuotas;

            if(!id || !cb) { alert("Campos vacíos"); return; }

            await setDoc(doc(db, "clientes", id), { numeroContrato: id, cedula: document.getElementById('admCedula').value, nombreTitular: document.getElementById('admTitular').value });
            await setDoc(doc(collection(db, "articulos")), { contratoId: id, nombreArticulo: document.getElementById('admArticulo').value, costoTotal: cb, valorInicial: valIni, totalCuotas: cuotas, cuotaValor: cuotaVal, alianzaAsociada: document.getElementById('admAliado').value, cuotasPagadas: ["inicial"] });
            alert("Contrato Creado!"); initMaestro();
        };

        window.crearAliado = async function() {
            const rif = document.getElementById('aliRif').value;
            await setDoc(doc(db, "alianzas", rif), { nombre: document.getElementById('aliNombre').value, rif: rif, password: document.getElementById('aliPass').value });
            alert("Aliado Creado!"); initMaestro();
        };

        window.delC = async function(id) { await deleteDoc(doc(db, "clientes", id)); initMaestro(); };
        window.calcAdmin = function() {
            const cb = parseFloat(document.getElementById('admCosto').value) || 0;
            const ini = (cb * parseInt(document.getElementById('admPorc').value)) / 100;
            const c = (cb - ini) / parseInt(document.getElementById('admCuotas').value);
            document.getElementById('rTot').innerText = `$${cb}`; document.getElementById('rIni').innerText = `$${ini}`; document.getElementById('rCuo').innerText = `$${c.toFixed(2)}`;
        };
    </script>
    <script>
        function tab(id, btn) { document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); btn.classList.add('active'); }
    </script>
</body>
</html>
